<!doctype html><meta charset="utf-8"><body><pre id="out">working</pre><script>
const img=new Image();img.onload=()=>{
 const X=690,Y=380,W=520,H=460;
 const c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d');
 g.drawImage(img,X,Y,W,H,0,0,W,H);
 const d=g.getImageData(0,0,W,H),p=d.data;
 const lum=i=>0.299*p[i]+0.587*p[i+1]+0.114*p[i+2];
 const bg=new Uint8Array(W*H),q=[];
 const push=(x,y)=>{const k=y*W+x;if(bg[k])return;const i=k*4,L=lum(i);if(L>150||(p[i]-p[i+2]<14&&L>=55)){bg[k]=1;q.push(k)}};
 for(let x=0;x<W;x++){push(x,0);push(x,H-1)}for(let y=0;y<H;y++){push(0,y);push(W-1,y)}
 while(q.length){const k=q.pop(),x=k%W,y=(k/W)|0;if(x>0)push(x-1,y);if(x<W-1)push(x+1,y);if(y>0)push(x,y-1);if(y<H-1)push(x,y+1)}
 let a=new Float32Array(W*H);for(let k=0;k<W*H;k++)a[k]=bg[k]?0:1;
 const er=(m)=>{const b=new Float32Array(m);for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++){let v=1;for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++)v=Math.min(v,m[(y+dy)*W+x+dx]);b[y*W+x]=v}return b};
 const di=(m)=>{const b=new Float32Array(m);for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++){let v=0;for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++)v=Math.max(v,m[(y+dy)*W+x+dx]);b[y*W+x]=v}return b};
 for(let i=0;i<7;i++)a=er(a);
 // mayor componente
 const lab=new Int32Array(W*H);let best=0,bestN=0,id=0;
 for(let k0=0;k0<W*H;k0++){if(a[k0]&&!lab[k0]){id++;let n=0;const st=[k0];lab[k0]=id;while(st.length){const k=st.pop();n++;const x=k%W,y=(k/W)|0;[[1,0],[-1,0],[0,1],[0,-1]].forEach(([dx,dy])=>{const xx=x+dx,yy=y+dy;if(xx<0||yy<0||xx>=W||yy>=H)return;const kk=yy*W+xx;if(a[kk]&&!lab[kk]){lab[kk]=id;st.push(kk)}})}if(n>bestN){bestN=n;best=id}}}
 for(let k=0;k<W*H;k++)a[k]=lab[k]===best?1:0;
 for(let i=0;i<5;i++)a=di(a);
 for(let i=0;i<2;i++)a=er(a);
 for(let it=0;it<3;it++){const b=new Float32Array(a);for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++){let s=0;for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++)s+=a[(y+dy)*W+x+dx];b[y*W+x]=s/9}a=b}
 // bbox
 let x0=W,y0=H,x1=0,y1=0;for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(a[y*W+x]>.5){x0=Math.min(x0,x);y0=Math.min(y0,y);x1=Math.max(x1,x);y1=Math.max(y1,y)}
 for(let k=0;k<W*H;k++)p[k*4+3]=Math.round(a[k]*255);
 g.putImageData(d,0,0);
 const o=document.createElement('canvas');const w=x1-x0+1+8,h=y1-y0+1+8;o.width=w;o.height=h;o.getContext('2d').drawImage(c,x0-4,y0-4,w,h,0,0,w,h);
 document.getElementById('out').textContent='DATA:'+o.toDataURL('image/png');
};img.src='/assets/coffee-beans-photographed-in-macro.jpg';
</script>
